---
# 1. Make sure firewalld is gone before ufw takes over.
- name: Gather service facts
  service_facts:

- name: Stop, disable and mask firewalld
  systemd:
    name: firewalld
    state: stopped
    enabled: false
    masked: true
  when: "'firewalld.service' in ansible_facts.services"
  notify:
    - firewall | restart docker
    - firewall | restart k3s

# 2. Install ufw and enable it with SSH allowed first, so enabling
#    can never lock out the Ansible connection.
- name: Install ufw
  apt:
    name: ufw
    state: present

- name: Allow SSH
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Enable ufw and default-deny incoming
  ufw:
    state: enabled
    policy: deny

- name: Ensure ufw starts at boot
  systemd:
    name: ufw
    enabled: true

# 3. Rules. ufw must already be active here: adding rules to an
#    inactive ufw fails with "ERROR: problem running".
- name: Allow TCP ports
  ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: tcp
  loop: "{{ firewall_tcp_ports }}"
  loop_control:
    label: "{{ item.port }}/tcp {{ item.comment }}"

- name: Allow UDP ports
  ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: udp
  loop: "{{ firewall_udp_ports }}"
  loop_control:
    label: "{{ item.port }}/udp {{ item.comment }}"

- name: Allow trusted container and k3s subnets
  ufw:
    rule: allow
    from_ip: "{{ item.cidr }}"
  loop: "{{ firewall_trusted_subnets }}"
  loop_control:
    label: "{{ item.cidr }} {{ item.comment }}"

- name: Allow LAN-only TCP ports
  ufw:
    rule: allow
    from_ip: "{{ firewall_lan_cidr }}"
    to_port: "{{ item.port | string }}"
    proto: tcp
  loop: "{{ firewall_lan_tcp_ports }}"
  loop_control:
    label: "{{ item.port }}/tcp from {{ firewall_lan_cidr }} {{ item.comment }}"
