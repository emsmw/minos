services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - /Docker/docker_volumes/prometheus/config:/etc/prometheus
      - /Docker/docker_volumes/prometheus/data:/prometheus