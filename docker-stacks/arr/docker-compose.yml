version: '3.9'
services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8085:8085 # qbittorrent web interface
      - 6881:6881 # qbittorrent torrent port
      - 9696:9696 # prowlarr
      - 8191:8191 # flaresolverr (Now accessible through Gluetun)
    volumes:
      - /Docker/docker_volumes/arr/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - TZ=America/Toronto
      - UPDATER_PERIOD=24h
    restart: unless-stopped

  deunhealth:
    image: qmcgaw/deunhealth
    container_name: deunhealth
    network_mode: "none"
    environment:
      - LOG_LEVEL=info
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - TZ=America/Toronto
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Standard socket path

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    labels:
      - deunhealth.restart.on.unhealthy="true"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
      - WEBUI_PORT=8085
    volumes:
      - /Docker/docker_volumes/arr/qbittorrent/config:/config
      - /mnt/Samsung4TB/arrs/Downloads:/data/downloads
    network_mode: service:gluetun

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /Docker/docker_volumes/arr/prowlarr/config:/config
    network_mode: service:gluetun
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Toronto
    network_mode: service:gluetun # MUST be here to share the VPN IP
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /Docker/docker_volumes/arr/sonarr/config:/config
      - /mnt/Samsung4TB/arrs/Downloads:/data/downloads
      - /mnt/Samsung4TB/Plex/TV Shows:/data/tvshows
    ports:
      - 8989:8989
    networks:
      - arr_net

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /Docker/docker_volumes/arr/radarr/config:/config
      - /mnt/Samsung4TB/arrs/Downloads:/data/downloads
      - /mnt/Samsung4TB/Plex/Movies:/data/movies
    ports:
      - 7878:7878
    networks:
      - arr_net

networks:
  arr_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.60.0/24
